# .github/workflows/scorecard.yml
#
# Dedicated OpenSSF Scorecard Workflow.
#
# Scorecard with `publish_results: true` communicates with the OpenSSF public
# transparency log and dashboard. The Scorecard REST API requires analysis
# to originate exclusively from the repository default branch (`main`) or via
# scheduled runs. Running Scorecard across pull requests or feature branches
# fails authentication and publishing requirements.
#
# Permissions:
#   - id-token: write (for keyless OIDC publishing to Scorecard API)
#   - security-events: write (for uploading SARIF report to GitHub Code Scanning)
#   - contents: read (to inspect repository configuration)
#   - actions: read (to inspect workflow files and actions)

name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard-analysis:
    name: Supply Chain Scorecard (OpenSSF)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard Analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard-results.sarif
          category: openssf-scorecard
