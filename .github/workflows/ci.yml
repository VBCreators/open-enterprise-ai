# .github/workflows/ci.yml
#
# Streamlined CI workflow for early-stage development.
#
# Install-step design rule used throughout:
#   NEVER rely on `pip install -e ".[dev]" || pip install <tools>`.
#   The first command can exit 0 WITHOUT providing the tools you need
#   (missing/empty [dev] extra only produces a warning). Instead: install the
#   project if possible, then VERIFY each required tool and install only what
#   is actually missing.

name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'refactor/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: '3.14'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  # =========================================================================
  # 1. Code Quality, Formatting, Pre-Commit & Syntax Hygiene
  # =========================================================================
  format-and-lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Run Ruff Lint & Format Check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check .

      - name: Verify Ruff Formatting
        run: |
          pip install --upgrade pip ruff
          ruff format --check .

      # Skip when the repo has no pre-commit config yet,
      # otherwise pre-commit/action fails outright.
      - name: Run Pre-Commit Hooks
        if: hashFiles('.pre-commit-config.yaml', '.pre-commit-config.yml') != ''
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure

      - name: Validate Workflow YAML Files (actionlint)
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Validate Docker Compose Configurations
        run: |
          for f in compose.yaml compose.yml compose.dev.yaml compose.dev.yml docker-compose.yaml docker-compose.yml; do
            if [ -f "$f" ]; then
              echo "[INFO] Validating $f"
              docker compose -f "$f" config --quiet
            fi
          done

  # =========================================================================
  # 2. Static Type Checking
  # =========================================================================
  type-check:
    name: Static Type Check (Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          # Preferred: the project's own dependency declaration.
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" \
              || echo "[WARN] 'pip install -e .[dev]' failed -- falling back to a standalone mypy install."
          elif [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt \
              || echo "[WARN] requirements-dev.txt install failed -- falling back."
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt \
              || echo "[WARN] requirements.txt install failed -- falling back."
          fi

          # Safety net: 'pip install -e .[dev]' can exit 0 WITHOUT providing
          # mypy (missing or incomplete [dev] extra). '||' never fires in that
          # case, so verify explicitly and install only what is missing.
          if ! command -v mypy >/dev/null 2>&1; then
            echo "[INFO] mypy not provided by the project -- installing it directly."
            pip install mypy types-requests types-PyYAML
          fi

      - name: Run Mypy
        run: |
          if ! command -v mypy >/dev/null 2>&1; then
            echo "::error::mypy is not available even after the fallback installation."
            exit 1
          fi

          # Nothing to type-check yet? Skip instead of erroring.
          PY_COUNT=$(find . -type f -name '*.py' \
            -not -path './.git/*' \
            -not -path './.venv/*' -not -path './venv/*' \
            -not -path './node_modules/*' \
            -not -path './build/*' -not -path './dist/*' \
            -not -path './.mypy_cache/*' \
            | wc -l)
          if [ "${PY_COUNT}" -eq 0 ]; then
            echo "[INFO] No Python source files found -- skipping mypy."
            exit 0
          fi

          # Phase 1: install missing third-party stubs.
          # NOTE: 'mypy --install-types' exits right after installing -- it does
          # NOT type-check -- so it must be a separate invocation.
          mypy --install-types --non-interactive . || true

          # Phase 2: the actual type check.
          mypy .

  # =========================================================================
  # 3. Unit Tests & OpenAPI Schema Contract Validation (Conditional)
  # =========================================================================
  unit-and-api-tests:
    name: Unit & API Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" \
              || echo "[WARN] 'pip install -e .[dev]' failed -- falling back to a standalone tool set."
          elif [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt \
              || echo "[WARN] requirements-dev.txt install failed -- falling back."
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt \
              || echo "[WARN] requirements.txt install failed -- falling back."
          fi

          # Verify-and-install: only fires for tools the project did NOT provide.
          ensure() {
            local import_name="$1" pip_name="${2:-$1}"
            if ! python -c "import ${import_name}" >/dev/null 2>&1; then
              echo "[INFO] '${pip_name}' not provided by the project -- installing it directly."
              pip install "${pip_name}"
            fi
          }

          ensure pytest
          ensure pytest_cov pytest-cov
          ensure pytest_asyncio pytest-asyncio

          # Web stack: only when the codebase actually references it, so the
          # OpenAPI check below can still skip gracefully for non-FastAPI code.
          if grep -rq --include='*.py' -E '^[[:space:]]*(from|import)[[:space:]]+(fastapi|httpx)\b' \
               tests open_enterprise_ai src 2>/dev/null; then
            ensure fastapi
            ensure httpx
          fi

      - name: OpenAPI Schema Contract Check (skips if app/FastAPI missing)
        run: |
          python - <<'PY'
          import importlib
          import importlib.util
          import sys
          from pathlib import Path

          APP_MODULE = "open_enterprise_ai.main"

          # Support src/ layouts even when the package was not installed.
          if Path("src").is_dir():
              sys.path.insert(0, str(Path("src").resolve()))

          # BYPASS RULE 1: the application entrypoint does not exist yet.
          if not any(
              p.is_file()
              for p in (
                  Path("open_enterprise_ai") / "main.py",
                  Path("src") / "open_enterprise_ai" / "main.py",
              )
          ):
              print(f"[INFO] {APP_MODULE}.py does not exist yet -- skipping OpenAPI contract check.")
              sys.exit(0)

          # BYPASS RULE 2: FastAPI is not yet available for import.
          if importlib.util.find_spec("fastapi") is None:
              print("[INFO] FastAPI is not installed -- skipping OpenAPI contract check.")
              sys.exit(0)

          # The app exists and FastAPI is available: failures from here are real.
          try:
              module = importlib.import_module(APP_MODULE)
          except ModuleNotFoundError as err:
              # main.py exists but one of ITS imports is missing (a project
              # dependency that is not declared/installed yet) -- skip gracefully.
              print(f"[WARN] Could not import {APP_MODULE} (missing dependency: {err}) -- skipping.")
              sys.exit(0)
          except Exception as err:
              print(f"[ERROR] Failed to import {APP_MODULE}: {err!r}")
              sys.exit(1)

          app = getattr(module, "app", None)
          if app is None:
              print(f"[INFO] {APP_MODULE} exists but does not define 'app' yet -- skipping.")
              sys.exit(0)

          if not callable(getattr(app, "openapi", None)):
              print(f"[INFO] {APP_MODULE}.app is not a FastAPI app yet -- skipping.")
              sys.exit(0)

          try:
              schema = app.openapi()
          except Exception as err:
              print(f"[ERROR] app.openapi() raised: {err!r}")
              sys.exit(1)

          if not isinstance(schema, dict) or "openapi" not in schema:
              print("[ERROR] Invalid OpenAPI schema generated.")
              sys.exit(1)

          print(f"[OK] FastAPI OpenAPI schema validated (OpenAPI {schema.get('openapi')}).")
          PY

      - name: Run Unit Tests (if they exist)
        run: |
          mkdir -p test-results coverage-results
          if [ -d "tests/unit" ] && [ -n "$(find tests/unit -name '*.py' -not -name '__init__.py' -not -name 'conftest.py' -print -quit)" ]; then
            # Only collect coverage for the package when it is importable,
            # otherwise pytest-cov emits noise for a missing module.
            COV_OPTS=()
            if python -c "import open_enterprise_ai" >/dev/null 2>&1; then
              COV_OPTS+=(--cov=open_enterprise_ai)
              COV_OPTS+=(--cov-report=xml:coverage-results/coverage-unit.xml)
              COV_OPTS+=(--cov-report=term-missing)
            else
              echo "[INFO] open_enterprise_ai not importable -- running tests without coverage."
            fi
            pytest tests/unit \
              --junitxml=test-results/unit-junit.xml \
              "${COV_OPTS[@]}" \
              -v
          else
            echo "[INFO] No unit tests found in tests/unit. Skipping."
          fi

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results-${{ github.sha }}
          path: |
            test-results/
            coverage-results/
          if-no-files-found: ignore
          retention-days: 7

  # =========================================================================
  # 4. Integration Tests (Conditional, No DB Containers)
  # =========================================================================
  integration-and-db-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [format-and-lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" \
              || echo "[WARN] 'pip install -e .[dev]' failed -- falling back to a standalone tool set."
          elif [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt \
              || echo "[WARN] requirements-dev.txt install failed -- falling back."
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt \
              || echo "[WARN] requirements.txt install failed -- falling back."
          fi

          ensure() {
            local import_name="$1" pip_name="${2:-$1}"
            if ! python -c "import ${import_name}" >/dev/null 2>&1; then
              echo "[INFO] '${pip_name}' not provided by the project -- installing it directly."
              pip install "${pip_name}"
            fi
          }

          ensure pytest
          ensure pytest_cov pytest-cov
          ensure pytest_asyncio pytest-asyncio
          if grep -rq --include='*.py' -E '^[[:space:]]*(from|import)[[:space:]]+(fastapi|httpx)\b' \
               tests open_enterprise_ai src 2>/dev/null; then
            ensure fastapi
            ensure httpx
          fi

      - name: Run Integration Tests (if they exist)
        run: |
          mkdir -p test-results coverage-results
          if [ -d "tests/integration" ] && [ -n "$(find tests/integration -name '*.py' -not -name '__init__.py' -not -name 'conftest.py' -print -quit)" ]; then
            COV_OPTS=()
            if python -c "import open_enterprise_ai" >/dev/null 2>&1; then
              COV_OPTS+=(--cov=open_enterprise_ai)
              COV_OPTS+=(--cov-report=xml:coverage-results/coverage-int.xml)
              COV_OPTS+=(--cov-report=term-missing)
            else
              echo "[INFO] open_enterprise_ai not importable -- running tests without coverage."
            fi
            pytest tests/integration \
              --junitxml=test-results/integration-junit.xml \
              "${COV_OPTS[@]}" \
              -v
          else
            echo "[INFO] No integration tests found in tests/integration. Skipping."
          fi

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results-${{ github.sha }}
          path: |
            test-results/
            coverage-results/
          if-no-files-found: ignore
          retention-days: 7

  # =========================================================================
  # 5. Final Quality Gate
  # =========================================================================
  coverage-gate:
    name: CI Gate Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - format-and-lint
      - type-check
      - unit-and-api-tests
      - integration-and-db-tests
    steps:
      - name: Verify All Required CI Checks Passed
        env:
          FORMAT_AND_LINT: ${{ needs.format-and-lint.result }}
          TYPE_CHECK: ${{ needs.type-check.result }}
          UNIT_AND_API: ${{ needs.unit-and-api-tests.result }}
          INTEGRATION: ${{ needs.integration-and-db-tests.result }}
        run: |
          results=(
            "${FORMAT_AND_LINT}"
            "${TYPE_CHECK}"
            "${UNIT_AND_API}"
            "${INTEGRATION}"
          )

          for result in "${results[@]}"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "::error::A required CI quality or testing check failed: ${result}"
                exit 1
                ;;
            esac
          done

          echo "All required CI quality, linting, type-checking, and test gates passed."
