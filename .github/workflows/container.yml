# .github/workflows/container.yml
#
#   Container workflow implementing:
# - Pre-flight Dockerfile sanity check (skip pipeline if Dockerfile is empty/comment-only)
# - Multi-stage Docker Buildx compilation with GHA layer caching
# - Dynamic semantic & SHA tag generation
# - Trivy container image layer vulnerability scanning
# - Grype second-opinion CVE scanning
# - Dockle CIS Docker Benchmark compliance check
# - SPDX Software Bill of Materials (SBOM) generation (Syft)
# - SLSA Build Provenance attestation (actions/attest-build-provenance)
# - Keyless cryptographic container signing (Sigstore Cosign via OIDC on
#   main branch AND release-tag pushes refs/tags/v*)
# - Safe delivery to GitHub Container Registry (GHCR) / Docker Hub
#
# All `uses:` references are pinned to immutable 40-character commit SHAs
# with the human-readable version as a trailing comment so Dependabot can
# still propose upgrades. Format:  uses: <repo>@<40-char-sha> # <version>
#
# Permissions rationale:
# - contents: read         -> Clone repository and build context
# - packages: write        -> Push compiled images to GHCR (dev/main only)
# - id-token: write        -> Generate Sigstore OIDC token for keyless Cosign signing
# - attestations: write    -> Publish SLSA build provenance attestations
# - security-events: write -> Upload Trivy/Grype SARIF findings to Security Tab

name: Container

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
    # -----------------------------------------------------------------
    # `type=semver` in the metadata step requires a tag-push trigger to
    # fire. Without this, the semver tag rule is unreachable and the
    # release flow silently breaks.
    #
    # Patterns:
    #     - v   1.2.3         -> stable release
    #     - v1.2.3-rc.1    -> pre-release (matches semver pre-release suffix)
    # -----------------------------------------------------------------
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc.*'
      - 'v*.*.*-alpha.*'
      - 'v*.*.*-beta.*'
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-scan-and-deliver:
    name: Build, Scan, Attest & Deliver Container
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---------------------------------------------------------------------
      # Normalize repository image name to lowercase.
      #
      # GitHub repository paths can contain uppercase letters (e.g., 'VBCreators/repo').
      # Container registries (GHCR, Docker Hub) strictly require lowercase image names.
      # Normalizing IMAGE_NAME to lowercase in GITHUB_ENV guarantees that all
      # subsequent steps (metadata tags, image references, attestations, and Cosign)
      # reference the valid lowercase image name.
      # ---------------------------------------------------------------------
      - name: Normalize Image Name to Lowercase
        id: normalize_image
        env:
          REPO_RAW: ${{ github.repository }}
        run: |
          image_lower="$(echo "${REPO_RAW}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=${image_lower}" >> "$GITHUB_ENV"
          echo "image_name=${image_lower}" >> "$GITHUB_OUTPUT"
          echo "Normalized image name: ${image_lower}"

      # ---------------------------------------------------------------------
      # Pre-flight: Detect whether the Dockerfile is actually buildable.
      # Empty file, missing file, or comment/whitespace-only file -> skip.
      #
      # Two fixes vs. the previous version:
      #   1. `grep -c` (not `grep | wc -l`) — satisfies shellcheck SC2126.
      #   2. `|| true` — `grep -c` exits 1 on zero matches, which would
      #      crash the script under `set -e` + `set -o pipefail` and
      #      prevent the "skip" branch from ever running. We need that
      #      branch for the early-stage "no Dockerfile yet" case.
      # ---------------------------------------------------------------------
      - name: Check if Dockerfile is buildable
        id: dockerfile_check
        shell: bash
        run: |
          set -e
          if [ ! -f "./Dockerfile" ]; then
            echo "is_buildable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dockerfile is missing — skipping container pipeline."
            exit 0
          fi

          # Count non-empty lines that are not pure comments.
          # `|| true` prevents grep's "no match" exit code (1) from killing
          # the script under `set -e` / `pipefail`.
          content_lines=$(grep -cvE '^\s*(#.*)?$' ./Dockerfile || true)
          echo "Non-comment, non-blank lines: ${content_lines}"

          if [ "${content_lines}" -gt 0 ]; then
            echo "is_buildable=true" >> "$GITHUB_OUTPUT"
            echo "Dockerfile contains real build instructions — proceeding."
          else
            echo "is_buildable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dockerfile is empty or contains only comments — skipping container pipeline."
          fi

      # ---------------------------------------------------------------------
      # Determine whether the current trigger is allowed to publish to a
      # registry. Keep all values in `env:` to avoid shell-injection
      # (semgrep `run-shell-injection`) — GitHub sets these env vars via
      # a safe API instead of pasting them raw into the script.
      #
      # Two distinct outputs:
      #   push_enabled  -> true for main / dev / refs/tags/v*
      #                    (drives "should we push to GHCR/Docker Hub?")
      #   sign_enabled  -> true for main / refs/tags/v*  (NOT dev)
      #                    (drives "should we Cosign-sign the image?")
      #
      # Why dev is published but NOT signed: dev is an integration
      # branch, its images are mutable and not consumed by downstream
      # verifiers. Pushing them to the Sigstore transparency log would
      # just create noise. Release tags (v*) and main, however, are the
      # artifacts consumers verify with `cosign verify`, so they MUST
      # be signed — otherwise versioned images have no integrity proof.
      # ---------------------------------------------------------------------
      - name: Determine if Push is Authorized
        id: auth_check
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          push_enabled="false"
          sign_enabled="false"

          if [ "${EVENT_NAME}" = "push" ]; then
            case "${GITHUB_REF}" in
              refs/heads/main|refs/heads/dev|refs/tags/v*)
                push_enabled="true"
                ;;
            esac

            case "${GITHUB_REF}" in
              refs/heads/main|refs/tags/v*)
                sign_enabled="true"
                ;;
            esac
          fi

          echo "push_enabled=${push_enabled}" >> "$GITHUB_OUTPUT"
          echo "sign_enabled=${sign_enabled}" >> "$GITHUB_OUTPUT"
          echo "auth_check: EVENT_NAME=${EVENT_NAME} REF=${GITHUB_REF} push_enabled=${push_enabled} sign_enabled=${sign_enabled}"

      # ---------------------------------------------------------------------
      # Configure tags for BOTH registries.
      #
      # Original bug: the `images:` list only contained
      #   `ghcr.io/<owner>/<repo>`
      # so docker/metadata-action only generated GHCR tags. The Docker Hub
      # login step ran, but docker/build-push-action received no Docker Hub
      # tags to push — so the image never actually reached Docker Hub.
      #
      # Fix: conditionally append a second `images:` line for Docker Hub,
      # keyed on `vars.PUSH_TO_DOCKERHUB == 'true'` AND the presence of the
      # `DOCKERHUB_USERNAME` secret. When the variable is false or the
      # secret is missing, the line collapses to an empty string, which
      # docker/metadata-action treats as "no extra image" — preserving the
      # GHCR-only behavior for everyone else.
      #
      # GHCR is intentionally listed FIRST so the `image_ref` step
      # (head -n1) keeps resolving to the GHCR image. All downstream
      # scanners (Trivy, Grype, Dockle, SBOM) and the Cosign signature
      # therefore continue to target GHCR — no collateral changes there.
      # Docker Hub just gets a parallel push as a side effect of the build.
      #
      # Note on `type=semver`: this rule activates only when the workflow
      # runs from a tag push matching vX.Y.Z. With the tag trigger now
      # wired up in `on.push.tags`, this rule actually fires for the
      # first time on releases.
      # ---------------------------------------------------------------------
      - name: Configure Docker Metadata & Tags
        id: meta
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ vars.PUSH_TO_DOCKERHUB == 'true' && secrets.DOCKERHUB_USERNAME && format('docker.io/{0}/{1}', secrets.DOCKERHUB_USERNAME, github.event.repository.name) || '' }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}

      # ---------------------------------------------------------------------
      # Resolve primary image reference for scanning and attestation.
      #
      # docker/metadata-action produces multiple tags. When multiple registries
      # or extra tags (e.g. latest, semver) are configured, `head -n1` could
      # select a Docker Hub or variable tag. We explicitly filter for the
      # immutable GHCR sha- tag so scanners, attestations, and Cosign target
      # the exact same artifact.
      # ---------------------------------------------------------------------
      - name: Resolve primary image reference
        id: image_ref
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          # Explicitly match the GHCR sha tag generated by metadata-action.
          primary="$(printf '%s\n' "${META_TAGS}" | grep -m1 "^${REGISTRY}/${IMAGE_NAME}:sha-" | tr -d '[:space:]')"
          if [ -z "${primary}" ]; then
            # Fallback to the first non-empty tag if the sha pattern did not match.
            primary="$(printf '%s\n' "${META_TAGS}" | head -n1 | tr -d '[:space:]')"
          fi
          echo "image_ref=${primary}" >> "$GITHUB_OUTPUT"
          echo "Using image reference: ${primary}"

      - name: Set up Docker Buildx
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.dockerfile_check.outputs.is_buildable == 'true' && steps.auth_check.outputs.push_enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Optional)
        if: steps.dockerfile_check.outputs.is_buildable == 'true' && steps.auth_check.outputs.push_enabled == 'true' && vars.PUSH_TO_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # Build step.
      #
      # IMPORTANT: provenance + sbom with --load (load=true) triggers
      #   "docker exporter does not currently support exporting manifest lists"
      # because the docker exporter cannot write multi-arch manifest lists
      # into the local Docker daemon.
      #
      # Fix: only enable provenance/sbom when we're actually pushing (--push).
      #
      # Note: docker/build-push-action pushes to EVERY tag in `tags:`. So
      # when the metadata step emits both GHCR and Docker Hub tags, this
      # one step publishes to both registries — no extra build needed.
      # ---------------------------------------------------------------------
      - name: Build Application Container
        id: build_step
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.auth_check.outputs.push_enabled == 'true' }}
          load: ${{ steps.auth_check.outputs.push_enabled != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ steps.auth_check.outputs.push_enabled == 'true' }}
          sbom: ${{ steps.auth_check.outputs.push_enabled == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Built Image with Trivy
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image_ref.outputs.image_ref }}
          format: sarif
          output: trivy-container-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy Container SARIF Report
        if: always() && steps.dockerfile_check.outputs.is_buildable == 'true' && hashFiles('trivy-container-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-container-results.sarif
          category: trivy-container

      # ---------------------------------------------------------------------
      # emit a SARIF report and upload it under a distinct category
      # (`grype-container`) so it shows up alongside Trivy in Code
      # Scanning without merging or overwriting Trivy's category.
      # ---------------------------------------------------------------------
      - name: Second-Opinion Vulnerability Scan (Grype)
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ steps.image_ref.outputs.image_ref }}
          fail-build: false
          output-format: sarif
          output-file: grype-container-results.sarif

      - name: Upload Grype Container SARIF Report
        if: always() && steps.dockerfile_check.outputs.is_buildable == 'true' && hashFiles('grype-container-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: grype-container-results.sarif
          category: grype-container

      - name: CIS Docker Benchmark Compliance Check (Dockle)
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        continue-on-error: true
        uses: goodwithtech/dockle-action@e30e6af832aad6ea7dca2a248d31a85eab6dbd68 # v0.4.15
        with:
          image: ${{ steps.image_ref.outputs.image_ref }}
          failure-threshold: WARN
          accept-key: CIS-DI-0001,CIS-DI-0005,CIS-DI-0006

      - name: Generate Software Bill of Materials (SBOM via Syft)
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        continue-on-error: true
        uses: anchore/sbom-action@f6c3d0fe42c3cf876e3462574e4c9416b5e0f07a # v0.9.0
        with:
          image: ${{ steps.image_ref.outputs.image_ref }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM Artifact
        if: always() && steps.dockerfile_check.outputs.is_buildable == 'true' && hashFiles('sbom.spdx.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

      - name: Attest SLSA Build Provenance
        if: steps.dockerfile_check.outputs.is_buildable == 'true' && steps.auth_check.outputs.push_enabled == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build_step.outputs.digest }}
          push-to-registry: true

      # ---------------------------------------------------------------------
      # Cosign keyless signing.
      #
      # Gated on `sign_enabled` (not `push_enabled`) because dev-branch
      # pushes publish images but intentionally leave them unsigned —
      # see auth_check step for the full policy.
      #
      # Without this gate, refs/tags/v* pushes (e.g. v1.2.3) would push
      # and attest the artifact but never sign it, breaking
      # `cosign verify ghcr.io/<owner>/<repo>:1.2.3` for every
      # downstream consumer that hard-fails on unsigned releases.
      # ---------------------------------------------------------------------
      - name: Install Cosign
        if: steps.dockerfile_check.outputs.is_buildable == 'true' && steps.auth_check.outputs.sign_enabled == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Container Image (Keyless OIDC)
        if: steps.dockerfile_check.outputs.is_buildable == 'true' && steps.auth_check.outputs.sign_enabled == 'true'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ steps.build_step.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Pipeline Skip Notice
        if: steps.dockerfile_check.outputs.is_buildable != 'true'
        run: |
          echo "::notice::Container pipeline was skipped because the Dockerfile is empty, missing, or contains only comments. This is expected at the initial stage of the project."
