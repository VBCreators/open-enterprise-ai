# .github/workflows/security.yml
#
# Production-grade Security & SAST workflow implementing:
# - Secret leak detection (Gitleaks + TruffleHog)
# - Python Static Application Security Testing (Bandit AST + Semgrep)
# - Dependency vulnerability scanning (Google OSV-Scanner + pip-audit)
# - Dockerfile security & best-practices linting (Hadolint)
# - GitHub Actions workflow security auditing (zizmor)
# - Filesystem vulnerability & misconfiguration scanning (Trivy FS)
# - Supply-chain security health assessment (OpenSSF Scorecard - moved to .github/workflows/scorecard.yml)
#
# All `uses:` references are pinned to immutable 40-character commit SHAs
# with the human-readable version as a trailing comment so Dependabot can
# still propose upgrades. Format:  uses: <repo>@<40-char-sha> # <version>
#
# NOTE: `google/osv-scanner-action` is a SPECIAL CASE — its root `action.yml`
# is metadata only (no `runs:` block). The real action lives in the
# `osv-scanner-action/` subdirectory, and Google officially recommends
# consuming it as a *reusable workflow*:
#   uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@<ver>
# Reusable workflows must be invoked at the job level (via `jobs.<id>.uses`).

name: Security

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'refactor/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday 03:00 UTC
  workflow_dispatch:

# Least-privilege top-level permission default.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: '3.14'

jobs:
  # =========================================================================
  # 1. Secret & Credential Leak Detection
  # =========================================================================
  secret-detection:
    name: Secret Detection (Gitleaks + TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Repository for Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      - name: Scan Repository for Secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@0186870afd2c4a90def791d80260923ba583d076 # v3.98.0
        with:
          path: ./
          base: ${{ (github.event_name == 'push' && github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000') && github.event.before || '' }}
          head: ${{ (github.event_name == 'push' && github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000') && 'HEAD' || '' }}

          extra_args: --debug --only-verified

  # =========================================================================
  # 2. Python SAST (Bandit + Semgrep)
  # =========================================================================
  python-sast:
    name: Python SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Run Bandit AST Security Scan.
      # If pyproject.toml is present, we enforce its configuration without a fallback,
      # ensuring configured exclusions and rules are respected and real findings fail cleanly.
      - name: Run Bandit AST Security Scan
        run: |
          pip install --upgrade pip bandit[toml]
          if [ -f pyproject.toml ]; then
            bandit -r . -c pyproject.toml -x ./.git,./.venv,./venv,./tests -ll
          else
            bandit -r . -x ./.git,./.venv,./venv,./tests -ll
          fi

      # Run Semgrep SAST.
      # Uses a pinned, immutable digest for the semgrep container image to
      # prevent unexpected rule drift and satisfy repository supply-chain requirements.
      # Mounts the current working directory via "$PWD" instead of interpolating
      # ${{ github.workspace }} in the shell script.
      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep@sha256:85782eaf09692e6dfb684cd3bad87ef315775814b01f76b4d15582e4ca7c1c89 \
            semgrep scan \
              --config=p/security-audit \
              --config=p/secrets \
              --config=p/owasp-top-ten \
              --config=p/python \
              --error

  # =========================================================================
  # 3. Google OSV-Scanner Reusable Workflow Call
  #
  # Google OSV-Scanner is officially consumed as a reusable workflow:
  #   google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml
  # Reusable workflows in GitHub Actions must be invoked at the *job level*
  # (via `jobs.<id>.uses`), not as a step under `steps:`.
  #
  # Gating policy:
  #   fail-on-vuln: true ensures that identified CVEs break the build,
  #   enforcing strict gating rather than only uploading SARIF reports.
  # =========================================================================
  osv-scanner:
    name: Dependency CVE Scan (Google OSV-Scanner)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      scan-args: |-
        -r
        ./
      fail-on-vuln: true
      upload-sarif: true

  # =========================================================================
  # 4. Dependency Vulnerability Audit (pip-audit)
  #
  # Complements OSV-Scanner by querying PyPI Advisories directly for Python
  # packages, scanning requirements.txt or pyproject.toml.
  # =========================================================================
  pip-audit:
    name: Dependency CVE Scan (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Run pip-audit
        run: |
          pip install --upgrade pip pip-audit uv
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          elif [ -f uv.lock ]; then
            # Export exact locked dependencies from uv.lock to audit the pinned environment
            uv export --frozen --all-groups --no-hashes --no-emit-project -o /tmp/requirements.txt
            pip-audit -r /tmp/requirements.txt
          elif [ -f pyproject.toml ]; then
            # Audit the project directory so dependencies declared in pyproject.toml are inspected
            pip-audit .
          else
            echo "No requirements file, uv.lock, or pyproject.toml found for pip-audit."
          fi

  # =========================================================================
  # 5. Dockerfile & Workflow Security (Hadolint + zizmor)
  #
  # The Hadolint `if` and `dockerfile` input are kept in sync: the step only
  # runs when a root `Dockerfile` exists, and the input names that exact file.
  # If you later add `Dockerfile.dev` / `Dockerfile.prod`, give them their own
  # steps or convert this into a matrix strategy.
  # =========================================================================
  dockerfile-and-workflow-audit:
    name: Dockerfile & Workflow Security (Hadolint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile (Hadolint)
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Python for zizmor
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # zizmor is run WITHOUT a `|| echo` fallback so a non-zero exit (any
      # finding) propagates as a failed step and blocks the PR.
      - name: Run zizmor Workflow Security Audit
        run: |
          pip install --upgrade pip zizmor
          zizmor .

  # =========================================================================
  # 6. Filesystem & Misconfiguration Scan (Trivy FS)
  # =========================================================================
  filesystem-misconfig-scan:
    name: Filesystem & Misconfiguration Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy FS SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem
