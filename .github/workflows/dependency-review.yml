# .github/workflows/dependency-review.yml
#
# Supply-chain dependency review for Pull Requests.
# Evaluates newly introduced or updated dependencies against the GitHub
# Advisory Database and licenses before merging into protected branches.
#
# All `uses:` references are pinned to immutable 40-character commit SHAs
# with the human-readable version as a trailing comment so Dependabot can
# still propose upgrades. Format:  uses: <repo>@<40-char-sha> # <version>
#
# Permissions rationale:
# - contents: read -> Required to inspect PR diff and manifest changes

name: Dependency Review

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review & License Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Perform Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
